<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <title>人類進化のあゆみ ─ 原人から現代人まで</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f111a;
      --ink: #e8eaf0;
      --muted: #97a0b5;
      --line: #2c3550;
      --certain: #4ade80;   /* 確かなこと */
      --debated: #fbbf24;   /* 議論が続いていること */
      --updated: #60a5fa;   /* 書き換わったこと */
      --accent: #ff8c42;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #05070d;
      color: var(--ink);
      font-family: 'DotGothic16', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 絵はウィンドウ全面に描く。
       9:16 の枠に閉じこめていたころ、横長のPCでは画面の3割しか使えず、
       残り7割が黒帯だった。絵を端まで広げると森も火あかりも画面いっぱいに届く。 */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      background: var(--bg);
      touch-action: none;
    }

    /* 縦画面が主。横長の画面では 9:16 の枠に収める。
       これは「絵の枠」ではなく「文字と操作の枠」。中身は絵を透かす。 */
    #stage {
      position: relative;
      z-index: 1;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      touch-action: none;
      /* 枠そのものは操作を受けない。受けてしまうと、まん中をタップしても
         背後のキャンバスに届かず、火に薪をくべられなくなる */
      pointer-events: none;
    }

    .panel, .card-screen, .title-screen { pointer-events: auto; }

    /* 上帯と下パネルは、文字を帯の中に置いたまま、背景の膜だけ画面の端まで伸ばす。
       伸ばさないと、横長の画面で帯の幅にぴったり切れた「黒い箱」が
       絵の上に浮いて見える。左右へ 50vw ずつはみ出させ、
       同じぶんを内側の余白で戻している。 */
    .topbar, .panel { margin-left: -50vw; margin-right: -50vw; }

    /* ---- 上部: 章インジケータと時代表示 ---- */
    .topbar {
      position: relative;
      z-index: 2;
      padding: max(10px, env(safe-area-inset-top)) calc(50vw + 14px) 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: linear-gradient(180deg, rgba(5,7,13,0.92), rgba(5,7,13,0));
    }

    .dots { display: flex; gap: 6px; align-items: center; }

    .dot {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: var(--line);
      transition: background 0.3s;
    }

    .dot.done { background: var(--muted); }
    .dot.now  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    .era-line { display: flex; align-items: baseline; gap: 8px; text-shadow: 0 1px 4px rgba(0,0,0,0.95); }
    .era-name { font-size: 17px; font-weight: bold; }
    .era-sub  { font-size: 10px; color: var(--muted); }
    .era-when { margin-left: auto; font-size: 11px; color: var(--accent); }

    /* ---- 下部: 解説と操作 ---- */
    .panel {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 14px calc(50vw + 14px) max(16px, env(safe-area-inset-bottom));
      /* 以前は 70% の高さまで不透明で、画面の下2割が絵として死んでいた。
         下端だけの薄い膜に変え、火あかりが文字の裏まで届くようにする。
         読みやすさは背景ではなく text-shadow で担保する。 */
      background: linear-gradient(0deg, rgba(5,7,13,0.88), rgba(5,7,13,0.52) 46%, rgba(5,7,13,0));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prompt { font-size: 14px; line-height: 1.6; min-height: 44px; text-shadow: 0 1px 4px rgba(0,0,0,0.95); }
    .prompt em { color: var(--accent); font-style: normal; font-weight: bold; }

    /* 体験中は、さらに薄くして火と植物に場所をゆずる。
       スキップは主役の操作ではないので、オレンジの大ボタンをやめて隅に小さく置く。 */
    .panel.lean { padding-top: 8px; gap: 7px; }
    .panel.lean .prompt { font-size: 13px; min-height: 36px; }
    .panel.lean .gauge { height: 6px; }
    .panel.lean .btn {
      width: auto;
      align-self: flex-end;
      padding: 7px 16px;
      font-size: 12px;
      background: rgba(255,255,255,0.09);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .gauge-wrap { display: none; flex-direction: column; gap: 4px; }
    .gauge-wrap.show { display: flex; }
    .gauge-label { font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
    .gauge { height: 8px; background: #1a2032; border-radius: 4px; overflow: hidden; }
    .gauge-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d1c, #f6d365); transition: width 0.12s linear; }
    .gauge-fill.low { background: #64748b; }

    .btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff8c42, #ffb95e);
      color: #1a0f04;
      cursor: pointer;
      width: 100%;
    }

    .btn.ghost { background: transparent; border: 2px solid var(--line); color: var(--muted); font-size: 13px; padding: 9px; }
    .btn:active { transform: translateY(1px); }

    /* ---- 事実カード ---- */
    .card-screen {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: rgba(5, 7, 13, 0.93);
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      touch-action: pan-y;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0s linear 0.3s;
    }

    .card-screen.show { opacity: 1; visibility: visible; transition: opacity 0.3s; }

    .card-title { font-size: 19px; font-weight: bold; }
    .card-when { font-size: 11px; color: var(--accent); }

    .fact { border-left: 3px solid var(--line); padding: 8px 0 8px 11px; }
    .fact h3 { font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; }
    .fact p  { font-size: 13px; line-height: 1.75; color: #cfd5e4; }
    .fact p + p { margin-top: 7px; }

    .fact.certain { border-color: var(--certain); }
    .fact.certain h3 { color: var(--certain); }
    .fact.debated { border-color: var(--debated); }
    .fact.debated h3 { color: var(--debated); }
    .fact.updated { border-color: var(--updated); }
    .fact.updated h3 { color: var(--updated); }

    .src { font-size: 10px; color: #6b7488; line-height: 1.6; margin-top: 6px; }

    .spacer { flex: 1; min-height: 8px; }

    /* ---- タイトル画面 ---- */
    .title-screen {
      position: absolute; inset: 0; z-index: 8;
      /* 真っ黒で塞がず、後ろの森をうっすら見せる。
         横長の画面では、帯だけ黒く塗ると絵の中に箱が浮いて見えるため */
      background: rgba(5, 7, 13, 0.86);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
      transition: opacity 0.4s, visibility 0s linear 0.4s;
    }
    .title-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .title-screen h1 { font-size: 24px; line-height: 1.5; }
    .title-screen p { font-size: 13px; color: var(--muted); line-height: 1.8; }
    .wip {
      font-size: 11px; color: var(--debated);
      border: 1px dashed var(--debated); border-radius: 8px; padding: 8px 12px; line-height: 1.7;
    }
  </style>
</head>
<body>
  <!-- 絵はウィンドウ全面に描くので、stage（文字と操作の枠）の外に置く -->
  <canvas id="scene"></canvas>

  <div id="stage">
    <div class="topbar">
      <div class="dots" id="dots"></div>
      <div class="era-line">
        <span class="era-name" id="eraName">—</span>
        <span class="era-sub" id="eraSub"></span>
        <span class="era-when" id="eraWhen"></span>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="prompt" id="prompt"></div>
      <div class="gauge-wrap" id="gaugeWrap">
        <div class="gauge-label"><span id="gaugeName">火のいきおい</span><span id="gaugeVal">100%</span></div>
        <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div></div>
      </div>
      <button class="btn" id="mainBtn">つぎへ</button>
    </div>

    <!-- 事実カード -->
    <div class="card-screen" id="cardScreen">
      <div>
        <div class="card-title" id="cardTitle"></div>
        <div class="card-when" id="cardWhen"></div>
      </div>
      <div id="cardBody"></div>
      <div class="spacer"></div>
      <button class="btn" id="cardNext">つぎの時代へ</button>
    </div>

    <!-- オープニング映像。素材が9:16の縦動画なので、縦画面では余白なしで収まる -->
    <div class="title-screen" id="introScreen" style="padding:0; background:#000; opacity:0; visibility:hidden;">
      <video id="introVideo" playsinline webkit-playsinline preload="auto"
             style="width:100%;height:100%;object-fit:cover;"
             poster="assets/intro_bg.jpg">
        <source src="assets/intro.mp4" type="video/mp4">
      </video>
      <button class="btn ghost" id="btnSkipIntro"
              style="position:absolute;right:14px;bottom:max(16px,env(safe-area-inset-bottom));width:auto;padding:8px 18px;background:rgba(0,0,0,0.55);color:#fff;">スキップ ▶</button>
    </div>

    <!-- タイトル -->
    <div class="title-screen" id="titleScreen">
      <h1>人類進化のあゆみ</h1>
      <p>原人から今のわたしたちまで、<br>人類が歩いてきた道を たいけんします。</p>
      <p style="font-size:11px; border-top:1px solid var(--line); padding-top:10px;">
        時代の順にすすみますが、これは<b>階段ではありません</b>。<br>
        ネアンデルタール人とホモ・サピエンスは、<br>同じ時代に生きていた<b>べつのなかま</b>です。
      </p>
      <div class="wip" style="color:var(--muted); border-color:var(--line); text-align:left;">
        お話は、3つの色に分けて書いてあります。<br>
        <b style="color:var(--certain)">みどり</b>… たしかなこと<br>
        <b style="color:var(--debated)">きいろ</b>… まだわかっていないこと<br>
        <b style="color:var(--updated)">あお</b>… むかしと変わったこと
      </div>
      <button class="btn" id="startBtn" style="max-width:240px;">はじめる</button>
      <a href="wide/" style="font-size:11px;color:var(--muted);">横画面のアクションゲーム版はこちら →</a>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
